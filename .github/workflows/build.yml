name: Build and publish tickets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tickets-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build PDF
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-xetex texlive-lang-cyrillic \
            texlive-fonts-recommended lmodern fonts-dejavu-core
      - name: Compile tickets
        run: python3 scripts/build.py
      - name: Save preview
        uses: actions/upload-artifact@v4
        with:
          name: tickets-pdf
          path: build/tickets.pdf
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish PDF
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          path: publication
          fetch-depth: 1
      - uses: actions/download-artifact@v4
        with:
          name: tickets-pdf
          path: ${{ runner.temp }}/tickets-output
      - name: Update pdf branch
        working-directory: publication
        env:
          SOURCE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Never replace a newer publication with an outdated build.
          git fetch origin main
          if [ "$(git rev-parse FETCH_HEAD)" != "$SOURCE_SHA" ]; then
            echo "A newer main commit exists; skipping this publication."
            exit 0
          fi

          if [ -n "$(git ls-remote --heads origin refs/heads/pdf)" ]; then
            git fetch origin pdf
            git checkout -B pdf FETCH_HEAD
          else
            git checkout --orphan pdf
          fi

          git rm -rf --ignore-unmatch . > /dev/null
          cp "$RUNNER_TEMP/tickets-output/tickets.pdf" tickets.pdf
          printf '%s\n' "$SOURCE_SHA" > SOURCE_COMMIT.txt
          {
            printf '# Актуальные билеты\n\n'
            printf '[Открыть PDF](tickets.pdf)\n\n'
            printf 'Исходники: https://github.com/%s/tree/%s\n\n' "$REPOSITORY" "$SOURCE_SHA"
            printf 'Сборка: %s\n' "$(date -u +'%Y-%m-%d %H:%M UTC')"
          } > README.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tickets.pdf SOURCE_COMMIT.txt README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Publish PDF for $SOURCE_SHA"
          git push origin HEAD:refs/heads/pdf
